<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 — Прямокутник</title>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --window-bg: #ffffff;
            --border-color: #d1d5db;
            --primary-accent: #0078d4;
            --hover-bg: #e5f1fb;
            --active-bg: #cde4fc;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .app-window {
            width: 900px;
            height: 600px;
            background: var(--window-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .title-bar {
            height: 36px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .menu-bar {
            height: 32px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 13px;
        }

        .menu-item-root {
            position: relative;
        }

        .menu-trigger {
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: #1f2937;
            transition: background 0.15s ease;
        }

        .menu-trigger:hover,
        .menu-trigger.active {
            background-color: var(--hover-bg);
            color: var(--primary-accent);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            padding: 4px 0;
            display: none;
            z-index: 100;
        }

        .dropdown-menu.visible {
            display: block;
        }

        .menu-option {
            padding: 6px 12px 6px 30px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: #374151;
        }

        .menu-option:hover {
            background-color: var(--hover-bg);
            color: var(--primary-accent);
        }

        .menu-option .check {
            position: absolute;
            left: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .toolbar {
            height: 40px;
            background: #fbfbfb;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 6px;
        }

        .toolbar-btn {
            width: 32px;
            height: 32px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            color: #374151;
            transition: all 0.15s ease;
        }

        .toolbar-btn:hover {
            background-color: var(--hover-bg);
            border-color: var(--border-color);
            color: var(--primary-accent);
        }

        .toolbar-btn.active {
            background-color: var(--active-bg);
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }

        .toolbar-btn svg {
            pointer-events: none;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background-color: #ffffff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
    </style>
</head>
<body>

<div class="app-window">
    <div class="title-bar" id="windowTitleBar">My Prog — Прямокутник</div>
    
    <nav class="menu-bar">
        <div class="menu-item-root" id="fileMenuContainer">
            <span class="menu-trigger" id="fileMenuTrigger">Файл</span>
            <div class="dropdown-menu" id="fileDropdown">
                <div class="menu-option" id="clearCanvasBtn">
                    <span class="check"></span>Очистити
                </div>
            </div>
        </div>

        <div class="menu-item-root" id="objectsMenuContainer">
            <span class="menu-trigger" id="objectsMenuTrigger">Об'єкти</span>
            <div class="dropdown-menu" id="objectsDropdown">
                <div class="menu-option" data-shape="POINT"><span class="check"></span>Крапка</div>
                <div class="menu-option" data-shape="LINE"><span class="check"></span>Лінія</div>
                <div class="menu-option" data-shape="RECTANGLE"><span class="check"></span>Прямокутник</div>
                <div class="menu-option" data-shape="ELLIPSE"><span class="check"></span>Еліпс</div>
                <div class="menu-option" data-shape="LINEOO"><span class="check"></span>Лінія з кружечками</div>
                <div class="menu-option" data-shape="CUBE"><span class="check"></span>Каркас куба</div>
            </div>
        </div>

        <div class="menu-item-root">
            <span class="menu-trigger" id="aboutTrigger">Довідка</span>
        </div>
    </nav>

    <div class="toolbar" id="mainToolbar">
        <button class="toolbar-btn" data-shape="POINT" type="button" title="Крапка">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="5"></circle>
            </svg>
        </button>
        <button class="toolbar-btn" data-shape="LINE" type="button" title="Лінія">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none">
                <line x1="4" y1="20" x2="20" y2="4"></line>
            </svg>
        </button>
        <button class="toolbar-btn active" data-shape="RECTANGLE" type="button" title="Прямокутник">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                <rect x="3" y="5" width="18" height="14" rx="1"></rect>
            </svg>
        </button>
        <button class="toolbar-btn" data-shape="ELLIPSE" type="button" title="Еліпс">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                <ellipse cx="12" cy="12" rx="9" ry="6"></ellipse>
            </svg>
        </button>
        <button class="toolbar-btn" data-shape="LINEOO" type="button" title="Лінія з кружечками">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <circle cx="6" cy="18" r="3" fill="currentColor"></circle>
                <circle cx="18" cy="6" r="3" fill="currentColor"></circle>
            </svg>
        </button>
        <button class="toolbar-btn" data-shape="CUBE" type="button" title="Каркас куба">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none">
                <rect x="3" y="9" width="11" height="11"></rect>
                <rect x="9" y="3" width="11" height="11"></rect>
                <line x1="3" y1="9" x2="9" y2="3"></line>
                <line x1="14" y1="9" x2="20" y2="3"></line>
                <line x1="14" y1="20" x2="20" y2="14"></line>
                <line x1="3" y1="20" x2="9" y2="14"></line>
            </svg>
        </button>
    </div>

    <main class="canvas-container">
        <canvas id="editorCanvas"></canvas>
    </main>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
