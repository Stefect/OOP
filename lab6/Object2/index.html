<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 — Object2 (Генератор)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: system-ui, sans-serif; background: #f3f3f3; padding: 12px; height: 100vh; display: flex; flex-direction: column; }
        .box { background: #fff; border: 1px solid #d1d5db; border-radius: 6px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 36px; background: #f9fafb; border-bottom: 1px solid #d1d5db; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px; font-weight: 600; color: #374151; }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
        .badge.ok { background: #dcfce7; color: #166534; }
        .badge.warn { background: #fef3c7; color: #92400e; }
        .table-wrap { flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        th { background: #f3f4f6; padding: 8px; border-bottom: 1px solid #d1d5db; position: sticky; top: 0; color: #4b5563; }
        td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; color: #1f2937; }
        tr:nth-child(even) { background: #f9fafb; }
        .footer { padding: 8px 12px; background: #f9fafb; border-top: 1px solid #d1d5db; font-size: 11px; color: #6b7280; text-align: right; }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <span>Згенеровані точки (x, y)</span>
            <span class="badge ok" id="statusBadge">Готово</span>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>№</th><th>X</th><th>Y</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="footer" id="footerInfo">Точок: 0</div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
