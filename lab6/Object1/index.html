<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 — Object1 (Менеджер)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: system-ui, sans-serif; background: #f3f3f3; display: grid; place-items: center; min-height: 100vh; }
        .dialog { background: #fff; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); width: 340px; overflow: hidden; }
        .header { background: #f9fafb; padding: 12px 16px; font-weight: 600; font-size: 14px; border-bottom: 1px solid #d1d5db; color: #374151; }
        .body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .field { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #374151; }
        .field input { width: 100px; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 4px; text-align: right; outline: none; }
        .field input:focus { border-color: #0078d4; }
        .footer { padding: 12px 16px; background: #f9fafb; border-top: 1px solid #d1d5db; text-align: right; }
        .btn { padding: 6px 16px; border-radius: 4px; border: none; background: #0078d4; color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn:hover { background: #005a9e; }
    </style>
</head>
<body>
    <form class="dialog" id="paramsForm">
        <div class="header">Lab 6: Введення параметрів (Варіант 0)</div>
        <div class="body">
            <div class="field"><label for="nPoint">Точок (nPoint):</label><input type="number" name="nPoint" value="10" min="2" max="100"></div>
            <div class="field"><label for="xMin">Min X:</label><input type="number" name="xMin" value="0"></div>
            <div class="field"><label for="xMax">Max X:</label><input type="number" name="xMax" value="100"></div>
            <div class="field"><label for="yMin">Min Y:</label><input type="number" name="yMin" value="0"></div>
            <div class="field"><label for="yMax">Max Y:</label><input type="number" name="yMax" value="100"></div>
        </div>
        <div class="footer">
            <button type="submit" class="btn">Виконати (Так)</button>
        </div>
    </form>
    <script type="module" src="./main.js"></script>
</body>
</html>
