<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 — Object1 (Головний менеджер)</title>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --window-bg: #ffffff;
            --border-color: #d1d5db;
            --primary-accent: #0078d4;
            --hover-bg: #e5f1fb;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dialog-box {
            background: var(--window-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 380px;
            overflow: hidden;
        }

        .dialog-header {
            height: 40px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .dialog-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #374151;
        }

        .form-group label {
            font-weight: 500;
        }

        .form-group input {
            width: 130px;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            text-align: right;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary-accent);
        }

        .dialog-footer {
            padding: 12px 16px;
            background: #f9fafb;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 4px;
            border: 1px solid var(--primary-accent);
            background-color: var(--primary-accent);
            color: #ffffff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.15s ease;
        }

        .btn:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>

    <div class="modal-overlay">
        <div class="dialog-box">
            <div class="dialog-header">Lab 6: Введення параметрів (Варіант 0)</div>
            <div class="dialog-body">
                <div class="form-group">
                    <label for="nPoint">Кількість точок (nPoint):</label>
                    <input type="number" id="nPoint" value="10" min="2" max="100">
                </div>
                <div class="form-group">
                    <label for="xMin">Мінімум X (xMin):</label>
                    <input type="number" id="xMin" value="0">
                </div>
                <div class="form-group">
                    <label for="xMax">Максимум X (xMax):</label>
                    <input type="number" id="xMax" value="100">
                </div>
                <div class="form-group">
                    <label for="yMin">Мінімум Y (yMin):</label>
                    <input type="number" id="yMin" value="0">
                </div>
                <div class="form-group">
                    <label for="yMax">Максимум Y (yMax):</label>
                    <input type="number" id="yMax" value="100">
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn" id="startBtn">Виконати (Так)</button>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
