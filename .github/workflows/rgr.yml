name: RGR CI

on:
  push:
    paths:
      - "RGR/**"
  pull_request:
    paths:
      - "RGR/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RGR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          for f in $(find src public test -name '*.js'); do
            node --check "$f" || exit 1
          done

      - name: Run tests
        run: npm test