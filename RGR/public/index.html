<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Векторний графічний редактор</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">Vector</div>

        <div class="group" id="tools">
          <button class="tool active" data-tool="select" title="Виділення (V)">↖</button>
          <button class="tool" data-tool="rectangle" title="Прямокутник (R)">▭</button>
          <button class="tool" data-tool="circle" title="Коло (C)">◯</button>
          <button class="tool" data-tool="line" title="Лінія (L)">╱</button>
        </div>

        <div class="group">
          <button id="undoBtn" class="icon" title="Скасувати (Ctrl+Z)">↶</button>
          <button id="redoBtn" class="icon" title="Повторити (Ctrl+Y)">↷</button>
        </div>

        <div class="spacer"></div>

        <div class="group">
          <input id="fileName" value="document.json" title="Ім'я файлу" />
          <button id="saveBtn">Зберегти</button>
          <button id="loadBtn">Відкрити</button>
          <button id="exportBtn">Експорт SVG</button>
        </div>
      </header>

      <main>
        <aside class="panel left">
          <h3>Шари</h3>
          <ul id="layers"></ul>
          <p id="emptyHint" class="muted">Полотно порожнє. Оберіть інструмент і намалюйте фігуру мишкою.</p>
        </aside>

        <section class="stage">
          <canvas id="canvas" width="800" height="600"></canvas>
        </section>

        <aside class="panel right">
          <h3>Властивості</h3>
          <p id="noSelection" class="muted">Оберіть фігуру на полотні або в списку шарів.</p>

          <div id="props" hidden>
            <div class="section" id="geometry"></div>

            <div class="section">
              <div class="field" id="fillRow">
                <label><input type="checkbox" id="fillOn" /> Заливка</label>
                <input type="color" id="fillColor" />
              </div>
              <div class="field">
                <label>Контур</label>
                <input type="color" id="strokeColor" />
              </div>
              <div class="field">
                <label>Товщина</label>
                <div class="range">
                  <input type="range" id="strokeWidth" min="1" max="20" />
                  <span id="strokeWidthValue"></span>
                </div>
              </div>
            </div>

            <div class="section">
              <label>Порядок</label>
              <div class="row">
                <button id="layerUp" class="secondary">▲ Вище</button>
                <button id="layerDown" class="secondary">▼ Нижче</button>
              </div>
            </div>

            <button id="deleteBtn" class="danger">Видалити фігуру</button>
          </div>
        </aside>
      </main>

      <footer id="status"></footer>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
