<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графічний редактор - Lab 2 (Варіант 4)</title>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --window-bg: #ffffff;
            --border-color: #d1d5db;
            --primary-accent: #0078d4;
            --hover-bg: #e5f1fb;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .app-window {
            width: 820px;
            height: 580px;
            background: var(--window-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .title-bar {
            height: 36px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .menu-bar {
            height: 32px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 13px;
        }

        .menu-item-root {
            position: relative;
        }

        .menu-trigger {
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: #1f2937;
            transition: background 0.15s ease;
        }

        .menu-trigger:hover,
        .menu-trigger.active {
            background-color: var(--hover-bg);
            color: var(--primary-accent);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            min-width: 170px;
            padding: 4px 0;
            display: none;
            z-index: 100;
        }

        .dropdown-menu.visible {
            display: block;
        }

        .menu-option {
            padding: 6px 12px 6px 30px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: #374151;
        }

        .menu-option:hover {
            background-color: var(--hover-bg);
            color: var(--primary-accent);
        }

        .menu-option .check {
            position: absolute;
            left: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background-color: #ffffff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
    </style>
</head>
<body>

<div class="app-window">
    <div class="title-bar">OOP_lab2 — Графічний редактор</div>
    
    <nav class="menu-bar">
        <div class="menu-item-root">
            <span class="menu-trigger">Файл</span>
        </div>

        <div class="menu-item-root" id="objectsMenuContainer">
            <span class="menu-trigger" id="objectsMenuTrigger">Об'єкти</span>
            <div class="dropdown-menu" id="objectsDropdown">
                <div class="menu-option" data-shape="POINT"><span class="check"></span>Крапка</div>
                <div class="menu-option" data-shape="LINE"><span class="check"></span>Лінія</div>
                <div class="menu-option" data-shape="RECTANGLE"><span class="check"></span>Прямокутник</div>
                <div class="menu-option" data-shape="ELLIPSE"><span class="check"></span>Еліпс</div>
            </div>
        </div>

        <div class="menu-item-root">
            <span class="menu-trigger" id="aboutTrigger">Довідка</span>
        </div>
    </nav>

    <main class="canvas-container">
        <canvas id="editorCanvas"></canvas>
    </main>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
